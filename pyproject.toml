[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clens"
version = "0.1.0"
description = "A code-aware IDE feature set for a subset of C: lexer, parser, AST, and syntax highlighter."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "c-lens contributors" }]
dependencies = []

[project.scripts]
clens = "clens.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clens"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/clens"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
